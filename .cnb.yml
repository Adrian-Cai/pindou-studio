master:
  push:
    - services:
        - docker
      # 防止多次推送并发部署，只保留最新一次排队
      lock:
        key: deploy-production
        wait: true
        cancel-in-wait: true
      stages:
        - name: 构建 Docker 镜像
          script: |
            docker build \
              -f server/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT} \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest \
              server
        - name: 推送镜像到 CNB 制品库
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        - name: SSH 部署到生产服务器
          imports:
            - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
          script: |
            set -e
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
              set -e
              cd /opt/pindou/deploy
              export IMAGE_REPO='${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}'
              export IMAGE_TAG='latest'
              docker compose pull
              docker compose up -d
            "

# 打 Tag 时用 Tag 名作为镜像标签构建并推送
$:
  tag_push:
    - services:
        - docker
      stages:
        - name: 构建 Docker 镜像
          script: |
            docker build \
              -f server/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH} \
              server
        - name: 推送镜像到 CNB 制品库
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}

  # 点击「部署 production」按钮且审批通过后，SSH 登录服务器执行部署
  tag_deploy.production:
    - imports:
        - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
      lock:
        key: deploy-production
        wait: true
        cancel-in-wait: true
      stages:
        - name: SSH 部署到生产服务器
          script: |
            set -e
            # 配置 SSH 密钥
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            # 远程拉取镜像并重启服务
            ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
              set -e
              cd /opt/pindou/deploy
              export IMAGE_REPO='${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}'
              export IMAGE_TAG='${IMAGE_TAG}'
              docker compose pull
              docker compose up -d
            "
