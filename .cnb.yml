master:
  push:
    - services:
        - docker
      # 防止多次推送并发部署，只保留最新一次排队
      lock:
        key: deploy-production
        wait: true
        cancel-in-wait: true
      stages:
        - name: 构建 Docker 镜像
          script: |
            docker build \
              -f server/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT} \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest \
              server
        - name: 推送镜像到 CNB 制品库
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        - name: SSH 部署到生产服务器
          imports:
            - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
          script: |
            set -eu
            # 缺少密钥时立即报错，避免生成空密钥文件导致 ssh 报 Permission denied
            : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY 未配置，请检查 envs.yml 导入}"
            : "${SSH_USER:?SSH_USER 未配置}"
            : "${SSH_HOST:?SSH_HOST 未配置}"
            : "${SSH_PORT:?SSH_PORT 未配置}"
            # 服务器只接受 ed25519 公钥，私钥写入 id_ed25519
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            # 校验私钥完整性，避免残缺密钥只报 Permission denied
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
              || { echo "SSH_PRIVATE_KEY 不是合法私钥，请在 envs.yml 更新为完整 PEM"; exit 1; }
            SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15"
            # 首次部署时服务器上没有 /opt/pindou/deploy：先建目录并上传 compose.yaml
            ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /opt/pindou/deploy"
            scp $SSH_OPTS -P "$SSH_PORT" deploy/compose.yaml \
              "$SSH_USER@$SSH_HOST:/opt/pindou/deploy/compose.yaml"
            # 制品库登录凭证属于发起构建的账号，须由流水线侧生成，勿改回服务器上 docker login
            REGISTRY_AUTH=$(printf '%s:%s' "$CNB_TOKEN_USER_NAME" "$CNB_TOKEN" | base64 -w0)
            ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "
              set -e
              cd /opt/pindou/deploy
              # postgres 容器的 DB_ 环境变量依赖该文件插值，缺失会以空密码建库
              test -r /opt/pindou/config/api.env || {
                echo '缺少 /opt/pindou/config/api.env，请先在服务器配置运行时环境变量'
                exit 1
              }
              # 私有镜像需制品库凭证，直接写入 compose 读取的 docker config，部署后清除
              mkdir -p /root/.docker
              printf '%s' '{"auths":{"'${CNB_DOCKER_REGISTRY}'":{"auth":"'$REGISTRY_AUTH'"}}}' \
                > /root/.docker/config.json
              export IMAGE_REPO='${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}'
              export IMAGE_TAG='latest'
              # 凭证写入失败或镜像不可拉取时立即失败，避免部署到旧镜像
              if ! docker compose pull; then
                rm -f /root/.docker/config.json
                exit 1
              fi
              docker compose --env-file /opt/pindou/config/api.env up -d
              rm -f /root/.docker/config.json
            "
        - name: 健康检查
          imports:
            - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
          script: |
            set -eu
            # 缺少密钥时立即报错，避免生成空密钥文件导致 ssh 报 Permission denied
            : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY 未配置，请检查 envs.yml 导入}"
            : "${SSH_USER:?SSH_USER 未配置}"
            : "${SSH_HOST:?SSH_HOST 未配置}"
            : "${SSH_PORT:?SSH_PORT 未配置}"
            # 服务器只接受 ed25519 公钥，私钥写入 id_ed25519
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            # 校验私钥完整性，避免残缺密钥只报 Permission denied
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
              || { echo "SSH_PRIVATE_KEY 不是合法私钥，请在 envs.yml 更新为完整 PEM"; exit 1; }
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE'
              echo "等待服务启动..."
              for i in $(seq 1 60); do
                code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/health 2>/dev/null || echo 000)
                if [ "$code" = "200" ]; then
                  echo "健康检查通过 (HTTP 200)"
                  curl -s http://localhost:3100/health
                  echo ""
                  exit 0
                fi
                echo "尝试 $i/60: HTTP $code"
                sleep 2
              done
              echo "健康检查失败，查看最近日志："
              cd /opt/pindou/deploy && docker compose logs --tail 50 api
              exit 1
            REMOTE

# 打 Tag 时用 Tag 名作为镜像标签构建并推送
$:
  tag_push:
    - services:
        - docker
      stages:
        - name: 构建 Docker 镜像
          script: |
            docker build \
              -f server/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH} \
              server
        - name: 推送镜像到 CNB 制品库
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}

  # 点击「部署 production」按钮且审批通过后，SSH 登录服务器执行部署
  tag_deploy.production:
    - imports:
        - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
