master:
  push:
    - services:
        - docker
      # 防止多次推送并发部署，只保留最新一次排队
      lock:
        key: deploy-production
        wait: true
        cancel-in-wait: true
      stages:
        - name: 构建 Docker 镜像
          script: |
            docker build \
              -f server/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT} \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest \
              server
        - name: 推送镜像到 CNB 制品库
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_COMMIT_SHORT}
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:latest
        - name: SSH 部署到生产服务器
          imports:
            - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
          script: |
            set -eu
            # 缺少密钥时立即报错，避免生成空密钥文件导致 ssh 报 Permission denied
            : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY 未配置，请检查 envs.yml 导入}"
            : "${SSH_USER:?SSH_USER 未配置}"
            : "${SSH_HOST:?SSH_HOST 未配置}"
            : "${SSH_PORT:?SSH_PORT 未配置}"
            # 服务器只接受 ed25519 公钥，私钥写入 id_ed25519
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            # 校验私钥完整性，避免残缺密钥只报 Permission denied
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
              || { echo "SSH_PRIVATE_KEY 不是合法私钥，请在 envs.yml 更新为完整 PEM"; exit 1; }
            SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15"
            # 首次部署时服务器上没有 /opt/pindou/deploy：先建目录并上传 compose.yaml
            ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p /opt/pindou/deploy/sql"
            scp $SSH_OPTS -P "$SSH_PORT" deploy/compose.yaml \
              "$SSH_USER@$SSH_HOST:/opt/pindou/deploy/compose.yaml"
            # 服务器上没有仓库，上传全部迁移脚本供部署时按编号执行
            for file in server/sql/*.sql; do
              scp $SSH_OPTS -P "$SSH_PORT" "$file" \
                "$SSH_USER@$SSH_HOST:/opt/pindou/deploy/sql/$(basename "$file")"
            done
            # 服务器出网被网络策略拦截拉不到镜像，改为构建容器 docker save 后经 ssh 管道 load 到服务器
            IMAGE_REPO="$CNB_DOCKER_REGISTRY/$CNB_REPO_SLUG_LOWERCASE"
            ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" docker load \
              < <(docker save "$IMAGE_REPO:latest")
            # 用带引号的 heredoc 传远端脚本，避免多层 ssh 双引号嵌套被 shell 改写
            # 远端命令不加引号，否则 heredoc 会被本地 sh 执行
            ssh $SSH_OPTS -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s -- \
              "$IMAGE_REPO" "latest" <<'REMOTE'
            set -eu
            export IMAGE_REPO="$1"
            export IMAGE_TAG="$2"
            cd /opt/pindou/deploy
            # 迁移连接信息来自该文件；缺失则无法对生产库执行迁移
            test -r /opt/pindou/config/api.env || {
              echo '缺少 /opt/pindou/config/api.env，请先在服务器配置运行时环境变量'
              exit 1
            }
            # 只取 DB_ 前缀变量，避免把 api.env 中其它配置打进日志环境
            DB_ENV=$(grep -E '^DB_[A-Z_]+=' /opt/pindou/config/api.env || true)
            for key in DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD; do
              echo "$DB_ENV" | grep -q "^${key}=" || {
                echo "api.env 缺少 ${key}，无法连接生产库执行迁移"
                exit 1
              }
            done
            # 去掉可选引号后导出为环境变量；第二个 sed 把 \$ 与反引号转成字面量，
            # 否则密码里的 \$ 会被 eval 二次展开
            set -a
            eval "$(printf '%s\n' "$DB_ENV" \
              | sed -E 's/^([A-Z_]+)="?([^"]*)"?$/\1="\2"/' \
              | sed -e 's/\\$/\\\$/g' -e 's/`/\\`/g')"
            set +a
            command -v psql > /dev/null || {
              echo '宿主机缺少 psql 命令，无法执行数据库迁移'
              exit 1
            }
            docker image inspect "$IMAGE_REPO:$IMAGE_TAG" > /dev/null || {
              echo "服务器缺少镜像 $IMAGE_REPO:$IMAGE_TAG，docker load 未成功"
              exit 1
            }
            # 旧容器可能由手工 docker run 或其它 compose 项目创建，无本项目 compose 标签，
            # 直接 up 会报 container name already in use；数据在 bind mount 中，删除容器不影响数据
            docker rm -f pindou-api 2>/dev/null || true
            # 先对生产库执行幂等迁移，再启动 API；否则 API 会因 schema contract 不一致反复重启。
            # 生产库是 api.env 里 DB_HOST 指向的外部实例，必须连它执行迁移；
            # 进 postgres 容器执行只会打到 compose 内的空库
            [ -n "$(ls -1 /opt/pindou/deploy/sql/[0-9][0-9][0-9]_*.sql 2>/dev/null)" ] || {
              echo '缺少 /opt/pindou/deploy/sql 迁移脚本'
              exit 1
            }
            for migration in $(ls -1 /opt/pindou/deploy/sql/[0-9][0-9][0-9]_*.sql | sort); do
              echo "执行迁移 $(basename "$migration")"
              PGPASSWORD="$DB_PASSWORD" psql \
                -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" \
                -v ON_ERROR_STOP=1 \
                -f "$migration"
            done
            docker compose --env-file /opt/pindou/config/api.env up -d --wait --wait-timeout 120 api
            REMOTE
        - name: 健康检查
          imports:
            - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
          script: |
            set -eu
            # 缺少密钥时立即报错，避免生成空密钥文件导致 ssh 报 Permission denied
            : "${SSH_PRIVATE_KEY:?SSH_PRIVATE_KEY 未配置，请检查 envs.yml 导入}"
            : "${SSH_USER:?SSH_USER 未配置}"
            : "${SSH_HOST:?SSH_HOST 未配置}"
            : "${SSH_PORT:?SSH_PORT 未配置}"
            # 服务器只接受 ed25519 公钥，私钥写入 id_ed25519
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            # 校验私钥完整性，避免残缺密钥只报 Permission denied
            ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
              || { echo "SSH_PRIVATE_KEY 不是合法私钥，请在 envs.yml 更新为完整 PEM"; exit 1; }
            ssh -i ~/.ssh/id_ed25519 \
              -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15 \
              -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
            echo "等待服务启动..."
            for i in $(seq 1 60); do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3100/health 2>/dev/null || echo 000)
              if [ "$code" = "200" ]; then
                echo "健康检查通过 (HTTP 200)"
                curl -s http://localhost:3100/health
                echo ""
                exit 0
              fi
              echo "尝试 $i/60: HTTP $code"
              sleep 2
            done
            echo "健康检查失败，查看最近日志："
            cd /opt/pindou/deploy && docker compose logs --tail 50 api
            exit 1
            REMOTE

# 打 Tag 时用 Tag 名作为镜像标签构建并推送
$:
  tag_push:
    - services:
        - docker
      stages:
        - name: 构建 Docker 镜像
          script: |
            docker build \
              -f server/Dockerfile \
              -t ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH} \
              server
        - name: 推送镜像到 CNB 制品库
          script: |
            docker push ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}

  # 点击「部署 production」按钮且审批通过后，SSH 登录服务器执行部署
  tag_deploy.production:
    - imports:
        - https://cnb.cool/ImAcaiy/envs/-/blob/main/envs.yml
