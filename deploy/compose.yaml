services:
  postgres:
    image: postgres:17-bookworm
    container_name: pindou-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /opt/pindou/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    image: ${IMAGE_REPO}:${IMAGE_TAG}
    container_name: pindou-api
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
    env_file:
      - ../config/api.env
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - /opt/pindou/data/avatars:/app/data/avatars
      - /opt/pindou/data/covers:/app/data/covers
      - /opt/pindou/data/ai:/app/data/ai
      - /opt/pindou/data/content-security:/app/data/content-security
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
